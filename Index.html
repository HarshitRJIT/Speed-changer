<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Speed Controller</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
            background: #1d1d1d;
            padding: 30px;
            border-radius: 16px;
        }

        h1 {
            margin-bottom: 25px;
        }

        video {
            width: 100%;
            max-height: 500px;
            background: black;
            border-radius: 10px;
        }

        .controls {
            margin-top: 25px;
        }

        input[type="file"] {
            margin-bottom: 20px;
        }

        .speed-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #555;
        }

        .speed-display {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }

        input[type="range"] {
            width: 80%;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎬 Video Speed Controller</h1>

    <input type="file" id="videoFile" accept="video/*">

    <video id="video" controls></video>

    <div class="controls">

        <div class="speed-display">
            Speed: <span id="speedValue">1x</span>
        </div>

        <input
            type="range"
            id="speedSlider"
            min="0.25"
            max="5"
            step="0.25"
            value="1"
        >

        <div class="speed-buttons">
            <button onclick="setSpeed(0.25)">0.25x</button>
            <button onclick="setSpeed(0.5)">0.5x</button>
            <button onclick="setSpeed(1)">1x</button>
            <button onclick="setSpeed(1.5)">1.5x</button>
            <button onclick="setSpeed(2)">2x</button>
            <button onclick="setSpeed(3)">3x</button>
            <button onclick="setSpeed(4)">4x</button>
            <button onclick="setSpeed(5)">5x</button>
        </div>

    </div>

</div>

<script>

    const video = document.getElementById("video");
    const videoFile = document.getElementById("videoFile");
    const speedSlider = document.getElementById("speedSlider");
    const speedValue = document.getElementById("speedValue");

    // Load selected video
    videoFile.addEventListener("change", function () {

        const file = this.files[0];

        if (file) {
            const videoURL = URL.createObjectURL(file);
            video.src = videoURL;
            video.load();
        }

    });

    // Change speed using slider
    speedSlider.addEventListener("input", function () {

        const speed = parseFloat(this.value);

        video.playbackRate = speed;
        speedValue.textContent = speed + "x";

    });

    // Change speed using buttons
    function setSpeed(speed) {

        video.playbackRate = speed;
        speedSlider.value = speed;
        speedValue.textContent = speed + "x";

    }

</script>

</body>
</html>
